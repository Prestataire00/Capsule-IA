project_id = "i-a-infinity-of"

[api]
enabled = true
port = 54321
schemas = ["public", "app", "audit", "infra", "reports", "graphql_public"]
extra_search_path = ["public", "app"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Auth Hook : custom JWT claims (organization_id, role, member_id)
# Cf. ADR 0003 (docs/architecture/adr/0003-auth-hook-pl-pgsql.md) +
# migration 0042_auth_hook.sql.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/app/before_token_emit"

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

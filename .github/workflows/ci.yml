name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        # TODO(sprint-4) — quand on retire ignoreBuildErrors:true, ce step sera
        # de facto bloquant pour le déploiement Railway. En attendant on signale
        # honnêtement, mais on n'échoue pas le pipeline pour ne pas bloquer les
        # merges sur une dette pré-existante.
        run: pnpm --filter web typecheck
        continue-on-error: true

      - name: Lint
        # TODO(sprint-4) — fix unused vars + `any` puis rendre bloquant.
        run: pnpm --filter web lint
        continue-on-error: true

      - name: Unit tests (Vitest)
        run: pnpm --filter web test

      - name: Format check
        # TODO(sprint-1.5) — un seul `pnpm format` puis rendre bloquant.
        run: pnpm format:check
        continue-on-error: true

  rls-tests:
    name: RLS (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Version figée : `latest` interroge l'API GitHub à chaque run et se
          # fait rate-limiter sur les runners partagés (« Failed to resolve
          # latest Supabase CLI release »), ce qui casse la CI sans rapport
          # avec le code. À remonter volontairement.
          version: 2.98.2

      - name: Start Supabase (local)
        run: supabase start --workdir supabase

      - name: Run pgTAP tests
        # TODO(sprint-5) — élargir la couverture pgTAP avant de rendre bloquant.
        run: supabase test db --workdir supabase
        continue-on-error: true

      - name: Stop Supabase
        if: always()
        run: supabase stop --workdir supabase --no-backup

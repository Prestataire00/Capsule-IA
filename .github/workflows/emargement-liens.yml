name: Liens d'émargement (toutes les 10 minutes)

# Envoie les liens d'émargement de 30 minutes avant chaque demi-journée à
# 10 minutes après (app/api/cron/emargement-liens), pour les organismes qui
# ont activé l'envoi automatique dans leurs paramètres. Idempotent.
# Nécessite le secret de dépôt CRON_SECRET (même valeur que côté Railway).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: emargement-liens
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    env:
      CRON_URL: https://capsule-ia.up.railway.app/api/cron/emargement-liens
    steps:
      - name: Déclenche l'envoi
        run: |
          http=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120 \
            "$CRON_URL")
          echo "HTTP $http"
          cat /tmp/resp.json || true
          echo
          test "$http" = "200"

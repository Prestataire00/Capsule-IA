name: DB migrations (prod)

# Applique les migrations Supabase à la prod à chaque merge sur main qui touche
# supabase/migrations/**. Comble le gap : Railway déploie le code mais n'applique
# pas les migrations → drift de schéma = 500 récurrents.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: {}

concurrency:
  group: db-migrate-prod
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: asocsynsvryroovdittc
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Version figée — voir ci.yml : `latest` est rate-limité sur les runners.
          version: 2.98.2
      - name: Link prod
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Dry-run (liste le pending)
        run: supabase db push --dry-run --include-all
      - name: Apply migrations
        run: supabase db push --include-all

      # Un échec ici est silencieux : le code part en production sans son schéma,
      # et rien ne le signale. Les migrations 0128 et 0129 sont restées treize
      # jours non appliquées de cette façon (audit CAP-04). On ouvre donc une
      # issue, qui notifie par les canaux habituels du dépôt.
      - name: Signaler l'échec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titre = `Migrations non appliquées en production (run ${context.runId})`;
            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'db-migrate',
            });
            const corps = [
              "Le workflow d'application des migrations a échoué.",
              '',
              '**Le code est déployé, son schéma ne l\'est pas** : les fonctionnalités',
              'concernées sont inertes en production jusqu\'à résolution.',
              '',
              `Exécution : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit : ${context.sha}`,
              '',
              'Solution de repli : jouer les fichiers `supabase/migrations/` non appliqués',
              "dans l'éditeur SQL Supabase, dans l'ordre des numéros.",
            ].join('\n');
            if (ouvertes.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ouvertes.data[0].number, body: corps,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titre, body: corps, labels: ['db-migrate'],
              });
            }
